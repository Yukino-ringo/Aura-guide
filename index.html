<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura 使用说明 · 阅读与研究工作台</title>
<meta name="description" content="Aura 是一个在本机运行的阅读与研究工作台：文献库、全文批注、Markdown 笔记、按期刊样式生成脚注与参考文献，支持 EXE 桌面版与网页版。">
<meta property="og:type" content="website">
<meta property="og:title" content="Aura 使用说明 · 阅读与研究工作台">
<meta property="og:description" content="把分散的 PDF、Word 文稿和书目集中成文献库：检索、阅读、批注、引用，一站完成。">
<style>
  :root{
    --ink:#1a1a18; --ink-soft:#57534a; --ink-faint:#8a8578;
    --paper:#f7f5ef; --card:#fffdf8; --line:#e3ded2; --accent:#1a1a18;
    --sidebar:#161513; --sidebar-ink:#b8b2a4; --sidebar-active:#f7f5ef;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;background:var(--paper);color:var(--ink);line-height:1.9}

  /* ===== 开场幕布 ===== */
  #curtain{position:fixed;inset:0;background:#111110;z-index:100;display:flex;align-items:center;justify-content:center;
           cursor:pointer;transition:opacity 1.2s ease,visibility 1.2s}
  #curtain.lift{opacity:0;visibility:hidden;pointer-events:none}
  #curtain .lines{max-width:780px;padding:0 42px;text-align:center}
  #curtain .cline{color:#f7f5ef;font-size:clamp(18px,2.4vw,27px);line-height:2.1;margin:20px 0;
                  opacity:0;transform:translateY(16px);transition:opacity 1.5s ease,transform 1.5s ease}
  #curtain .cline.show{opacity:1;transform:none}
  #curtain .cline.dim{opacity:.45}
  #curtain .enter{margin-top:52px;color:#8a8578;font-size:13px;letter-spacing:5px;opacity:0;transition:opacity 1.2s}
  #curtain .enter.show{opacity:1;animation:breath 2.6s ease-in-out infinite}
  @keyframes breath{50%{opacity:.3}}

  /* ===== 侧边导航 ===== */
  nav{position:fixed;inset:0 auto 0 0;width:264px;background:var(--sidebar);color:var(--sidebar-ink);
      padding:36px 0 24px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;z-index:10;
      transition:width .32s ease,box-shadow .32s ease}
  nav .brand{padding:0 30px 24px;border-bottom:1px solid #2a2823;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:13px}
  nav .brand .mark{width:42px;height:42px;flex:none;filter:invert(1);mix-blend-mode:screen}
  nav .brand .mark img{width:100%;height:100%;object-fit:contain}
  nav .brand .logo{font-size:29px;letter-spacing:3px;color:#f7f5ef;font-weight:700}
  nav a{display:block;padding:9px 30px;color:var(--sidebar-ink);text-decoration:none;font-size:14.5px;transition:all .15s;white-space:nowrap}
  nav a .n{display:inline-block;width:2.2em;color:#6d675a;font-size:12px}
  nav a:hover{color:#fff;background:#201e1a}
  nav a.active{color:var(--sidebar-active);background:#24221e;border-right:3px solid #f7f5ef}
  nav .foot{margin-top:auto;padding:18px 30px 0;font-size:12px;color:#6d675a;font-style:italic;white-space:nowrap}
  nav .progress{position:absolute;right:0;top:0;bottom:0;width:3px;pointer-events:none}
  nav .progress i{display:block;width:100%;height:100%;background:#f7f5ef;opacity:.55;transform-origin:top;transform:scaleY(0)}
  /* 收起成窄条：看正文时让位，悬停展开 */
  body.mini nav{width:76px}
  body.mini nav .brand{padding:0 0 20px;gap:0}
  body.mini nav .brand .logo{display:none}
  body.mini nav a{padding:10px 0;text-align:center}
  body.mini nav a .t{display:none}
  body.mini nav a .n{width:auto;font-size:13px}
  body.mini nav a.active{border-right:none;background:#24221e}
  body.mini nav .foot{display:none}
  body.mini nav:hover{width:264px;box-shadow:10px 0 34px rgba(0,0,0,.4)}
  body.mini nav:hover .brand{padding:0 30px 24px;gap:13px}
  body.mini nav:hover .brand .logo{display:block}
  body.mini nav:hover a{padding:9px 30px;text-align:left}
  body.mini nav:hover a .t{display:inline}
  body.mini nav:hover a .n{width:2.2em;font-size:12px}
  body.mini nav:hover a.active{border-right:3px solid #f7f5ef}
  body.mini nav:hover .foot{display:block}

  /* ===== 正文 ===== */
  main{margin-left:264px;max-width:1020px;padding:0 56px 120px;transition:margin-left .32s ease}
  body.mini main{margin-left:76px}
  header.hero{padding:88px 0 40px;border-bottom:1px solid var(--line);margin-bottom:20px}
  header.hero .kicker{font-size:13px;letter-spacing:6px;color:var(--ink-faint);text-transform:uppercase}
  header.hero h1{font-size:52px;font-weight:700;letter-spacing:2px;margin:14px 0 10px}
  header.hero .meta{color:var(--ink-soft);font-size:15px}
  section{display:none;padding:42px 0 26px}
  section.active{display:block;animation:fadein .35s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2{font-size:30px;font-weight:700;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:baseline;gap:14px}
  h2 .num{font-size:14px;color:var(--ink-faint);letter-spacing:2px;font-weight:400}
  h3{font-size:19px;margin:26px 0 4px;font-weight:700}
  p{margin:12px 0;color:var(--ink-soft);font-size:15.5px;text-align:justify}
  ol.steps,ul.dots{margin:12px 0 12px 1.4em;color:var(--ink-soft);font-size:15.5px}
  ol.steps li,ul.dots li{margin:6px 0}
  b,strong{color:var(--ink)}
  figure{margin:26px 0 8px;background:var(--card);border:1px solid var(--line);padding:14px}
  figure img{width:100%;display:block;border:1px solid var(--line);cursor:zoom-in}
  figcaption{font-size:13px;color:var(--ink-faint);margin-top:10px;text-align:center}
  .tip{border-left:3px solid var(--ink);background:var(--card);padding:12px 18px;margin:16px 0;font-size:14.5px;color:var(--ink-soft)}

  /* 思想者裁切肖像 */
  .thinker-row{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin:34px 0 8px}
  .thinker{width:148px;text-align:center;transition:transform .25s ease}
  .thinker img{width:100%;display:block;box-shadow:0 7px 20px rgba(26,26,24,.2);transform:rotate(var(--r,0deg));transition:transform .25s ease}
  .thinker:hover img{transform:rotate(0deg) translateY(-6px)}
  .thinker .tname{margin-top:13px;font-size:14px;font-weight:700;color:var(--ink)}
  .thinker .tnote{font-size:12px;color:var(--ink-faint);margin-top:2px}
  .thinker-cap{text-align:center;font-size:13px;color:var(--ink-faint);margin-top:18px}

  /* 社区连接 */
  .brand-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0 8px}
  .brand-card{background:var(--card);border:1px solid var(--line);padding:18px 16px 14px;text-align:center;transition:box-shadow .15s}
  .brand-card:hover{box-shadow:0 4px 14px rgba(26,26,24,.08)}
  .brand-card .icon{height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .brand-card .icon img{max-height:40px;max-width:120px;object-fit:contain}
  .brand-card .bname{font-weight:700;font-size:15px;color:var(--ink)}
  .brand-card .bdesc{font-size:12.5px;color:var(--ink-faint);margin-top:4px;line-height:1.6}

  /* 下载区 */
  .dl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:22px 0 8px}
  .dl-card{display:block;background:var(--sidebar);color:#f7f5ef;text-decoration:none;padding:24px 22px;border:1px solid #2a2823;transition:transform .15s,box-shadow .15s}
  .dl-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(26,26,24,.25)}
  .dl-card .dtype{font-size:12px;letter-spacing:3px;color:#8a8578}
  .dl-card .dname{font-size:20px;font-weight:700;margin:8px 0 4px}
  .dl-card .dsize{font-size:13px;color:#b8b2a4}
  .dl-card .dbtn{display:inline-block;margin-top:14px;padding:7px 18px;border:1px solid #f7f5ef;font-size:13.5px;letter-spacing:1px}

  table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14.5px;background:var(--card)}
  th,td{border:1px solid var(--line);padding:9px 14px;text-align:left;vertical-align:top}
  th{background:#efece3;font-weight:700;color:var(--ink)}
  td{color:var(--ink-soft)}

  /* 问题与反馈 */
  .fb-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:22px 0 8px}
  .fb-card{background:var(--card);border:1px solid var(--line);padding:24px 22px}
  .fb-card h4{font-size:17px;color:var(--ink);margin-bottom:8px}
  .fb-card p{font-size:14px;margin:6px 0}
  .fb-btn{display:inline-block;margin-top:14px;padding:9px 22px;background:var(--ink);color:#f7f5ef;text-decoration:none;font-size:14px;letter-spacing:1px;border:1px solid var(--ink);cursor:pointer;font-family:inherit}
  .fb-btn.off{background:transparent;color:var(--ink-faint);border-color:var(--line);cursor:default}
  .like-btn{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:10px 24px;background:var(--card);border:1px solid var(--ink);color:var(--ink);font-size:15px;cursor:pointer;font-family:inherit;transition:all .15s}
  .like-btn:hover{background:var(--ink);color:#f7f5ef}
  .like-btn.liked{background:var(--ink);color:#f7f5ef}
  .like-btn .heart{font-size:17px}
  .like-btn.liked .heart{animation:pop .4s ease}
  @keyframes pop{40%{transform:scale(1.45)}}
  .like-note{font-size:12.5px;color:var(--ink-faint);margin-top:10px}

  /* 致谢 */
  .oss-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:20px 0 8px}
  .oss-card{display:block;background:var(--card);border:1px solid var(--line);padding:15px 16px;text-decoration:none;transition:box-shadow .15s}
  .oss-card:hover{box-shadow:0 4px 14px rgba(26,26,24,.1)}
  .oss-card .oname{font-weight:700;font-size:14.5px;color:var(--ink)}
  .oss-card .odesc{font-size:12.5px;color:var(--ink-faint);margin-top:3px;line-height:1.6}
  .dev-card{margin:20px 0 8px;background:var(--sidebar);color:#f7f5ef;padding:28px 26px;border:1px solid #2a2823}
  .dev-card .dname{font-size:22px;font-weight:700;letter-spacing:1px}
  .dev-card .drole{font-size:12px;letter-spacing:3px;color:#8a8578;margin:6px 0 12px}
  .dev-card p{color:#b8b2a4;font-size:14px;margin:6px 0}

  /* 页脚统计 */
  footer.site{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:8px 26px}

  #lightbox{position:fixed;inset:0;background:rgba(15,14,12,.92);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
  #lightbox img{max-width:94vw;max-height:94vh}
  #lightbox.on{display:flex}
  #top{position:fixed;right:26px;bottom:26px;width:44px;height:44px;border:1px solid var(--line);background:var(--card);
       color:var(--ink);font-size:18px;cursor:pointer;display:none;z-index:20}
  #top.on{display:block}
  @media (max-width:900px){
    nav{position:static;width:100%;flex-direction:column}
    body.mini nav{width:100%}
    body.mini nav .brand .logo{display:block}
    body.mini nav a{padding:9px 30px;text-align:left}
    body.mini nav a .t{display:inline}
    body.mini nav a .n{width:2.2em;font-size:12px}
    body.mini nav .foot{display:block}
    main,body.mini main{margin-left:0;padding:0 22px 80px}
    header.hero h1{font-size:36px}
    .thinker{width:126px}
  }
</style>
</head>
<body>

<div id="curtain" aria-hidden="true">
  <div class="lines">
    <p class="cline" id="cl0">也许，还需要一间自己的房间</p>

    <p class="cline" id="cl3">重新发现作品的“光晕（Aura）”</p>
    <div class="enter" id="curtainEnter">点 击 进 入</div>
  </div>
</div>

<nav id="nav">
  <div class="brand"><div class="mark"><img src="assets/aura-logo.png" alt="Aura 标志"></div><div class="logo">Aura</div></div>
  <div id="navlinks"></div>
  <div class="foot">Keep reading, thinking non-stop.</div>
</nav>
<main>
  <header class="hero">
    <div class="kicker">阅读与研究工作台</div>
    <h1>Aura 使用说明</h1>
    <div class="meta">Aura v1.1 · 2026 年 9 月 · 适用于 EXE 桌面版与网页版</div>
  </header>
  <div id="content"></div>
  <footer class="site">
    <span>Aura Guide · 由 Yuki-no-Ringo 制作</span>
    <span id="viewStat">本页已被阅读 <b id="viewCount">—</b> 次</span>
  </footer>
</main>
<div id="lightbox"><img alt="放大截图"></div>
<button id="top" title="回到顶部">↑</button>
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script>
/* ============================================================
   说明书文案（全部集中在这里，指哪段改哪段）

   {p:"段落"} {h3:"小节"} {tip:"提示"} {steps:[..]} {dots:[..]}
   {shot:"assets/xx.png", cap:"图注"}
   {table:{head:[..], rows:[[..]]}}
   {brands:[{icon,name,desc}]}          社区图标卡
   {downloads:[{type,name,size,href}]}  下载卡
   {thinkers:[{img,name,note}]}         思想者裁切肖像

   {feedback:true}                      问题与反馈卡（问卷 + 点赞）
   {developer:true}                     开发者卡
   ============================================================ */
const SURVEY_URL = "https://v.wjx.cn/vm/rWcg5pE.aspx";   // 问卷做好后把链接填在这里，例如 "https://wj.qq.com/s2/xxxxx"
const LIKE_API = "https://api.counterapi.dev/v1/aura-guide-yuki-no-ringo/cheers";

const CONTENT = [
{ id:"download", num:"↓", title:"下载 Aura v1.1", blocks:[
  {p:"Aura支持exe与网页两种形态，功能相同，下载可任选其一。"},
  {downloads:[
    {type:"EXE 桌面版", name:"Aura-v1.1.exe", size:"约 415 MB · 百度网盘 · 提取码 x35v", href:"https://pan.baidu.com/s/1jS6RZNBstwKnFc1rvcmQQg?pwd=x35v"},
    {type:"网页版压缩包", name:"Aura-v1.1-网页版.zip", size:"约 121 MB · 百度网盘 · 提取码 1rxe", href:"https://pan.baidu.com/s/1MkLe1Tnc_rTfBhSn7KxkBg?pwd=1rxe"}
  ]}
]},
{ id:"about", num:"01", title:"Aura 是什么", blocks:[
  {p:"Aura 是一个在本机运行的阅读与研究工作台：把分散的 PDF、Word 文稿和书目集中成文献库，支持在线检索书目、全文阅读批注、Markdown 笔记、按期刊样式生成脚注与参考文献，并把引用直接写进你的 DOCX 文稿。"},
  {p:"Aura 有两种形态，功能一致：EXE 桌面版双击即用；网页版在后台运行一个仅本机可访问的本地服务，用浏览器打开工作台。除在线检索书目和封面外，全部功能离线可用；你的文献、笔记和计时记录都保存在自己的电脑上。"},
  {dots:[
    "随附独立运行环境，不需要安装任何依赖。",
    "适用 Windows 10 / 11（64 位）。",
    "打开即是空白资料库，不含任何示例数据，从零开始建立自己的文献库。"
  ]},
  {h3:"连接的社区与书库"},
  {p:"Aura 与以下开放社区连接，用来检索书目、核对版本、抓取封面与导入引用样式；连接只读取公开书目信息，你的文献内容不会发送给任何一方。"},
  {brands:[
    {icon:"assets/icons/douban.ico", name:"豆瓣读书", desc:"书目检索 · 链接导入 · 封面"},
    {icon:"assets/icons/openlibrary.svg", name:"Open Library", desc:"书目检索 · 版本核对 · 封面"},
    {icon:"assets/icons/zotero.png", name:"Zotero", desc:"RIS 题录导入，兼容 JSTOR 等数据库导出"},
    {icon:"assets/icons/csl.png", name:"CSL 样式库", desc:"Zotero 官方样式目录与中文社区样式库"}
  ]}
]},
{ id:"install", num:"02", title:"安装与启动", blocks:[
  {h3:"网页版"},
  {steps:[
    "将 Aura-v1.1-网页版.zip 完整解压到一个普通本地目录（例如“文档”下的某个文件夹）。不要直接在压缩包内运行，也不要放在 C 盘根目录、Program Files 等需要管理员权限的位置。",
    "双击“启动网页.cmd”。首次启动会展开随附环境，需要等待片刻；随后浏览器自动打开 Aura 工作台。",
    "Aura 会自动选择一个空闲的本地端口并记住它，之后每次启动都是同一个网址，可以把标签页加入收藏夹。",
    "关闭浏览器标签页不会停止后台服务。要完全退出，双击“停止网页.cmd”。"
  ]},
  {h3:"EXE 桌面版"},
  {p:"双击 Aura-v1.1.exe 即可启动，无需安装。首次启动系统可能提示未知发布者，属于正常现象（软件未做商业代码签名）。"},
  {h3:"资料保存在哪里"},
  {p:"全部资料（文献库、全文文件、笔记、文稿副本）保存在程序目录下的 storage 文件夹。日后升级 Aura 时，用新包解压到新目录后，把旧目录的 storage 整体复制过来即可。切勿用新版直接覆盖旧目录。"}
]},
{ id:"tour", num:"03", title:"界面导览", blocks:[
  {p:"页面左侧是模块栏，Aura 共有十个模块；顶部是当前文献与导入口。文献库首页上方有一条“使用日历与专注”摘要，默认折叠，点击可展开日历和计时器。"},
  {shot:"assets/01-library-covers.jpg", cap:"Aura 工作台首页：左侧模块栏 + 文献库封面视图"},
  {table:{head:["模块","用途"], rows:[
    ["文献库","全部文献的家：封面 / 清单两种视图、分类整理、搜索、项目管理、上传本地全文。"],
    ["导入文献","导入 PDF / Word 全文，或批量导入 RIS 题录。"],
    ["搜索书目","联网检索豆瓣与 OpenLibrary 书目，核对版本后加入文献库。"],
    ["阅读与批注","打开已上传全文的文献，逐页阅读并做图文批注。"],
    ["文献笔记","按文献整理 Markdown 笔记，支持上传、预览与导出。"],
    ["引用与参考文献","建立写作项目，把文献排成引用序列，按样式生成脚注和参考文献表。"],
    ["文稿引用助手","把引用写进 DOCX 文稿：本地 DOCX 模式（推荐）或实时连接 WPS / Word。"],
    ["样式管理","管理引用样式（CSL），可从在线目录导入数千种期刊样式。"],
    ["回收站","删除的文献先进入回收站，可恢复或彻底删除。"],
    ["备份与设置","导出 / 恢复完整备份，查看数据说明。"]
  ]}}
]},
{ id:"import", num:"04", title:"导入文献的四种方式", blocks:[
  {h3:"4.1 导入 PDF / Word 全文"},

<script>
/* ============ 渲染逻辑 ============ */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const content=document.getElementById("content"), navlinks=document.getElementById("navlinks");
const ROTS=["-2deg","1.6deg","-1.2deg","2deg","-1.6deg","1.2deg"];
CONTENT.forEach(sec=>{
  navlinks.insertAdjacentHTML("beforeend",`<a href="#${sec.id}"><span class="n">${sec.num}</span><span class="t">${esc(sec.title)}</span></a>`);
  let html=`<section id="${sec.id}"><h2><span class="num">${sec.num}</span>${esc(sec.title)}</h2>`;
  for(const b of sec.blocks){
    if(b.p) html+=`<p>${esc(b.p)}</p>`;
    if(b.h3) html+=`<h3>${esc(b.h3)}</h3>`;
    if(b.tip) html+=`<div class="tip">${esc(b.tip)}</div>`;
    if(b.steps) html+=`<ol class="steps">${b.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
    if(b.dots) html+=`<ul class="dots">${b.dots.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
    if(b.shot) html+=`<figure><img src="${b.shot}" alt="${esc(b.cap||"")}" loading="lazy"><figcaption>${esc(b.cap||"")}</figcaption></figure>`;
    if(b.table) html+=`<table><tr>${b.table.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    if(b.brands) html+=`<div class="brand-row">${b.brands.map(x=>`<div class="brand-card"><div class="icon"><img src="${x.icon}" alt="${esc(x.name)}"></div><div class="bname">${esc(x.name)}</div><div class="bdesc">${esc(x.desc)}</div></div>`).join("")}</div>`;
    if(b.downloads) html+=`<div class="dl-row">${b.downloads.map(x=>`<a class="dl-card" href="${x.href}" target="_blank" rel="noopener"><span class="dtype">${esc(x.type)}</span><div class="dname">${esc(x.name)}</div><div class="dsize">${esc(x.size)}</div><span class="dbtn">下载</span></a>`).join("")}</div>`;
    if(b.thinkers) html+=`<div class="thinker-row">${b.thinkers.map((t,i)=>`<div class="thinker"><img src="${t.img}" alt="${esc(t.name)}" style="--r:${ROTS[i%ROTS.length]}" loading="lazy"><div class="tname">${esc(t.name)}</div><div class="tnote">${esc(t.note)}</div></div>`).join("")}</div>`;
    if(b.oss) html+=`<div class="oss-row">${b.oss.map(o=>`<a class="oss-card" href="${o.url}" target="_blank" rel="noopener"><div class="oname">${esc(o.name)}</div><div class="odesc">${esc(o.desc)}</div></a>`).join("")}</div>`;
    if(b.feedback) html+=`<div class="fb-row">
      <div class="fb-card"><h4>内测问卷</h4>
        <p>几分钟就好，聊聊你的使用感受和想要的功能。问卷结果会直接寄到作者手里。</p>
        ${SURVEY_URL?`<a class="fb-btn" href="${SURVEY_URL}" target="_blank" rel="noopener">填写问卷</a>`:`<span class="fb-btn off">问卷筹备中，即将上线</span>`}
      </div>
      <div class="fb-card"><h4>给作者一点鼓励</h4>
        <p>如果 Aura 帮到了你，点一下这里，让作者知道又有一位读者来过。</p>
        <button class="like-btn" id="likeBtn" type="button"><span class="heart">♥</span><span id="likeText">鼓励一下</span>·<span id="likeCount">—</span></button>
        <div class="like-note" id="likeNote"></div>
      </div>
    </div>`;
    if(b.developer) html+=`<div class="dev-card">
      <div class="dname">Yuki-no-Ringo</div>
      <div class="drole">努力vibe coding的文科生</div>
      <p>Aura 由 Yuki-no-Ringo 一个人设计并开发，是一个关于阅读的长期项目。</p>
    </div>`;
  }
  content.insertAdjacentHTML("beforeend",html+"</section>");
});

/* ============ 开场幕布 ============ */
(function(){
  const curtain=document.getElementById("curtain");
  let seen=false;
  try{seen=sessionStorage.getItem("aura-guide-seen")==="1";}catch(e){}
  if(seen){curtain.remove();return;}
  const lines=[document.getElementById("cl0"),document.getElementById("cl1"),document.getElementById("cl2"),document.getElementById("cl3")];
  const enter=document.getElementById("curtainEnter");
  const timers=[
    setTimeout(()=>lines[0].classList.add("show"),700),
    setTimeout(()=>{lines[0].classList.add("dim");lines[1].classList.add("show");},2600),
    setTimeout(()=>{lines[1].classList.add("dim");lines[2].classList.add("show");},4500),
    setTimeout(()=>{lines[2].classList.add("dim");lines[3].classList.add("show");},6400),
    setTimeout(()=>enter.classList.add("show"),8000)
  ];
  curtain.addEventListener("click",()=>{
    timers.forEach(clearTimeout);
    try{sessionStorage.setItem("aura-guide-seen","1");}catch(e){}
    curtain.classList.add("lift");
    setTimeout(()=>curtain.remove(),1400);
  });
})();

/* ============ 图片放大 ============ */
const lb=document.getElementById("lightbox"), lbImg=lb.querySelector("img");
document.querySelectorAll("figure img").forEach(img=>img.addEventListener("click",()=>{lbImg.src=img.src;lb.classList.add("on");}));
lb.addEventListener("click",()=>lb.classList.remove("on"));

/* ============ 导航：高亮、收起、进度 ============ */
const links=[...document.querySelectorAll("#navlinks a")];
const secs=[...document.querySelectorAll("section")];
const topBtn=document.getElementById("top");
function show(id){
  secs.forEach(s=>s.classList.toggle("active",s.id===id));
  links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+id));
  scrollTo(0,0);
}
links.forEach(a=>a.addEventListener("click",e=>{
  e.preventDefault();
  const id=a.getAttribute("href").slice(1);
  show(id);
  history.replaceState(null,"","#"+id);
}));
const first=location.hash.slice(1);
show(secs.some(s=>s.id===first)?first:secs[0].id);
addEventListener("scroll",()=>{topBtn.classList.toggle("on",scrollY>600);},{passive:true});
topBtn.addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));

/* ============ 浏览量（不蒜子，部署到线上后生效） ============ */
(function(){
  const n=document.getElementById("viewCount");
  let tries=0;
  const poll=setInterval(()=>{
    const v=document.getElementById("busuanzi_value_site_pv");
    if(v&&v.textContent.trim()){n.textContent=v.textContent.trim();clearInterval(poll);}
    else if(++tries>40){n.textContent="—";clearInterval(poll);}
  },500);
})();

/* ============ 点赞 ============ */
(function(){
  const btn=document.getElementById("likeBtn"), cnt=document.getElementById("likeCount"),
        txt=document.getElementById("likeText"), note=document.getElementById("likeNote");
  if(!btn)return;
  let liked=false;
  try{liked=localStorage.getItem("aura-guide-liked")==="1";}catch(e){}
  const paint=()=>{btn.classList.toggle("liked",liked);txt.textContent=liked?"已收到你的心意":"鼓励一下";};
  paint();
  fetch(LIKE_API).then(r=>r.json()).then(d=>{if(typeof d.count==="number")cnt.textContent=d.count;else cnt.textContent="—";})
    .catch(()=>{cnt.textContent="—";note.textContent="计数服务暂时连不上，心意照样能送到。";});
  btn.addEventListener("click",()=>{
    if(liked){note.textContent="这份心意已经送到过了，谢谢你。";return;}
    liked=true;paint();
    try{localStorage.setItem("aura-guide-liked","1");}catch(e){}
    fetch(LIKE_API+"/up").then(r=>r.json()).then(d=>{
      if(typeof d.count==="number")cnt.textContent=d.count;
      note.textContent="谢谢你，已经寄到作者手里了。";
    }).catch(()=>{note.textContent="网络不太顺，但这份心意作者收下了。";});
  });
})();
</script>
</body>
</html>
